<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts: Inter (Sans) & Playfair Display (Serif) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- Fallback title; per-route <title>/<meta>/<link> are injected at build time
       from each page's <SEO> component (vite-prerender-plugin), and set client-side
       by React 19 in dev. Do not add route-specific meta/OG/canonical here — it
       would wrongly persist on every pre-rendered sub-page. -->
  <title>Vivien Perrelle | Founder, AI for Science</title>
</head>

<body class="bg-cream text-primary antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Build-time pre-render entry (vite-prerender-plugin). Required here so Vite
       preserves its `prerender` export for detection. It pulls in react-dom/server
       and is NEVER shipped: the strip-prerender-artifacts plugin in vite.config.js
       removes its modulepreload from every page and drops the chunk. -->
  <script type="module" prerender src="/src/prerender.jsx"></script>

</body>

</html>
