<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Interaction coefficients are defined by closed measurement loops</title>
  <desc id="desc">Pairwise epistasis uses WT, A, B, and AB. With WT-referenced effects, third-order epistasis uses A, B, C, AB, AC, BC, and ABC. An isolated AB or ABC measurement cannot identify its interaction coefficient.</desc>
  <rect width="600" height="1040" fill="#FDFBF7"/>

  <style>
    text{font-family:Inter,Arial,sans-serif}
    .key{font-size:22px;font-weight:600;fill:#1A1A1A}
    .label{font-size:14px;font-weight:400;fill:#5A5A5A}
    .center{text-anchor:middle}
    .node-label{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
    .measured-label{fill:#FDFBF7}
    .reference-label{fill:#5A5A5A}
    .divider{stroke:#E5E0D8;stroke-width:1.5}
    .dark-edge{fill:none;stroke:#3A2328;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .light-edge{fill:none;stroke:#E5E0D8;stroke-width:1.5;stroke-linecap:round}
    .measured{fill:#3A2328;stroke:#3A2328;stroke-width:2}
    .reference{fill:#FDFBF7;stroke:#5A5A5A;stroke-width:2}
    .focal{fill:none;stroke:#3A2328;stroke-width:2;stroke-dasharray:5 5}
  </style>

  <text x="40" y="48" class="key">Closed measurement loops</text>

  <g aria-label="Pairwise measurement loop">
    <text x="300" y="100" class="key center">Pairwise</text>
    <text x="300" y="130" class="label center">AB alone: insufficient</text>
    <path d="M300 180L300 390 M190 285H410" class="light-edge"/>
    <path d="M300 180L190 285L300 390L410 285Z" class="dark-edge"/>
    <circle cx="300" cy="180" r="28" class="measured"/>
    <circle cx="300" cy="180" r="38" class="focal"/>
    <text x="300" y="180" class="node-label measured-label">AB</text>
    <circle cx="190" cy="285" r="25" class="measured"/>
    <text x="190" y="285" class="node-label measured-label">A</text>
    <circle cx="410" cy="285" r="25" class="measured"/>
    <text x="410" y="285" class="node-label measured-label">B</text>
    <circle cx="300" cy="390" r="28" class="reference"/>
    <text x="300" y="390" class="node-label reference-label">WT</text>
  </g>

  <line x1="40" y1="440" x2="560" y2="440" class="divider"/>

  <g aria-label="Third-order measurement loop">
    <text x="300" y="490" class="key center">Third-order</text>
    <text x="300" y="520" class="label center">ABC alone: insufficient</text>
    <path d="M190 810L300 570 M300 810V570 M410 810L300 570" class="light-edge"/>
    <path d="M190 810L160 690L300 570 M190 810L300 690L300 570 M300 810L160 690 M300 810L440 690 M410 810L300 690 M410 810L440 690 M160 690L300 570 M440 690L300 570" class="dark-edge"/>
    <circle cx="300" cy="570" r="30" class="measured"/>
    <circle cx="300" cy="570" r="41" class="focal"/>
    <text x="300" y="570" class="node-label measured-label">ABC</text>
    <circle cx="160" cy="690" r="25" class="measured"/>
    <text x="160" y="690" class="node-label measured-label">AB</text>
    <circle cx="300" cy="690" r="25" class="measured"/>
    <text x="300" y="690" class="node-label measured-label">AC</text>
    <circle cx="440" cy="690" r="25" class="measured"/>
    <text x="440" y="690" class="node-label measured-label">BC</text>
    <circle cx="190" cy="810" r="24" class="measured"/>
    <text x="190" y="810" class="node-label measured-label">A</text>
    <circle cx="300" cy="810" r="24" class="measured"/>
    <text x="300" y="810" class="node-label measured-label">B</text>
    <circle cx="410" cy="810" r="24" class="measured"/>
    <text x="410" y="810" class="node-label measured-label">C</text>
  </g>

  <line x1="40" y1="870" x2="560" y2="870" class="divider"/>
  <g aria-label="Figure legend">
    <circle cx="55" cy="910" r="12" class="measured"/>
    <text x="78" y="915" class="label">dark filled node = measured variant</text>
    <circle cx="355" cy="910" r="12" class="reference"/>
    <circle cx="355" cy="910" r="19" class="focal"/>
    <text x="382" y="915" class="label">dashed outline = focal target</text>
    <line x1="55" y1="960" x2="95" y2="960" class="dark-edge"/>
    <text x="112" y="965" class="label">dark edge = closed loop</text>
    <line x1="355" y1="960" x2="395" y2="960" class="light-edge"/>
    <text x="412" y="965" class="label">light edge = related</text>
  </g>
</svg>
