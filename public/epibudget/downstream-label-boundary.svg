<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Label boundaries in downstream evaluation</title>
  <desc id="desc">The plate is selected before measured fitness is revealed. A fixed learner is then trained on selected measurements and ranks held-out variants without held-out ESM features.</desc>
  <rect width="600" height="760" fill="#FDFBF7"/>

  <style>
    text{font-family:Inter,Arial,sans-serif}
    .key{font-size:22px;font-weight:600;fill:#1A1A1A}
    .label{font-size:14px;font-weight:400;fill:#5A5A5A}
    .center{text-anchor:middle}
    .box{fill:#FDFBF7;stroke:#1A1A1A;stroke-width:1.5}
    .arrow{fill:none;stroke:#5A5A5A;stroke-width:2;stroke-linecap:round}
    .barrier{stroke:#1B3022;stroke-width:2}
    .barrier-label{font-size:14px;font-weight:600;fill:#1B3022;text-anchor:middle}
    .divider{stroke:#E5E0D8;stroke-width:1.5}
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5A5A5A" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="40" y="48" class="key">Downstream label boundaries</text>

  <g aria-label="Evaluation flow">
    <rect x="90" y="82" width="420" height="92" rx="12" class="box"/>
    <text x="300" y="136" class="key center">Select plate</text>

    <path d="M300 174V218" class="arrow" marker-end="url(#arrowhead)"/>
    <line x1="145" y1="204" x2="455" y2="204" class="barrier"/>
    <rect x="222" y="190" width="156" height="28" fill="#FDFBF7"/>
    <text x="300" y="210" class="barrier-label">no measured labels</text>

    <rect x="90" y="232" width="420" height="92" rx="12" class="box"/>
    <text x="300" y="286" class="key center">Reveal fitness</text>

    <path d="M300 324V366" class="arrow" marker-end="url(#arrowhead)"/>
    <rect x="90" y="380" width="420" height="92" rx="12" class="box"/>
    <text x="300" y="434" class="key center">Train fixed learner</text>

    <path d="M300 472V516" class="arrow" marker-end="url(#arrowhead)"/>
    <line x1="145" y1="502" x2="455" y2="502" class="barrier"/>
    <rect x="224" y="488" width="152" height="28" fill="#FDFBF7"/>
    <text x="300" y="508" class="barrier-label">no held-out ESM</text>

    <rect x="90" y="530" width="420" height="92" rx="12" class="box"/>
    <text x="300" y="572" class="key center">Rank held-out variants</text>
    <text x="300" y="600" class="label center">doubles · triples · Sₘₐcᵣₒ</text>
  </g>

  <line x1="40" y1="660" x2="560" y2="660" class="divider"/>
  <g aria-label="Figure legend">
    <path d="M70 704H120" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="140" y="709" class="label">evaluation flow</text>
    <line x1="330" y1="704" x2="390" y2="704" class="barrier"/>
    <text x="410" y="709" class="label">restricted information</text>
  </g>
</svg>
